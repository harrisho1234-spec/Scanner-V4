<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner V4</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c49a45">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scanner V4">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 UMD CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html2canvas for card-to-image exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- ZXing Barcode Scanning Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    .font-serif-elegant {
      font-family: 'Playfair Display', serif;
    }
    .font-mono-code {
      font-family: 'Fira Code', monospace;
    }
  </style>
</head>
<body class="bg-[#fbf9f4] text-slate-800 flex flex-col h-screen overflow-hidden">

  <!-- React Root Anchor -->
  <div id="app-root" class="w-full h-full flex flex-col overflow-hidden"></div>

  <!-- React Code Base -->
  <script type="text/babel">
    const SvgIcons = {
      Search: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      ),
      Barcode: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 5v14M8 5v14M12 5v14M17 5v14M21 5v14"/></svg>
      ),
      Image: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      ),
      Download: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      ),
      Alert: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      ),
      Sun: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      ),
      Moon: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      ),
      Camera: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      )
    };

    const logoUrl = "https://lh3.googleusercontent.com/d/1lW4DKT9IDiuo97MxmAgZMKVdLXOUItnf";

    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      const [items, setItems] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncError, setSyncError] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [cameraError, setCameraError] = useState(null);
      const [cameraStatus, setCameraStatus] = useState("");
      const [availableCameras, setAvailableCameras] = useState([]);
      const [activeCameraId, setActiveCameraId] = useState(null);
      
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");

      const videoRef = useRef(null);
      const codeReaderRef = useRef(null);
      const cardRef = useRef(null);
      const [exporting, setExporting] = useState(false);

      const targetSheetUrl = "https://docs.google.com/spreadsheets/d/1maKk_lPYMYval44vnorm3_awwrIh5IYPKLovn_gWYtg/edit?gid=828283876#gid=828283876";

      useEffect(() => {
        fetchSheetData(targetSheetUrl);
      }, []);

      useEffect(() => {
        let buffer = "";
        let lastKeyTime = Date.now();

        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' && e.target.type === 'text' && !isScanning) {
            return;
          }

          const currentTime = Date.now();
          if (currentTime - lastKeyTime > 100) {
            buffer = "";
          }
          lastKeyTime = currentTime;

          if (e.key === 'Enter') {
            if (buffer.length > 1) {
              setSearchQuery(buffer.trim());
              buffer = "";
            }
          } else if (e.key.length === 1) {
            buffer += e.key;
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isScanning]);

      const releaseCameraStream = () => {
        const video = videoRef.current;
        if (video && video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
          video.srcObject = null;
        }
      };

      const startDecoding = async (deviceId) => {
        const codeReader = codeReaderRef.current;
        if (!codeReader || !videoRef.current) return;

        await codeReader.decodeFromVideoDevice(deviceId, videoRef.current, (result, err) => {
          if (result) {
            setSearchQuery(result.getText());
            stopCameraScan();
            return;
          }
          if (err && err.name && err.name !== 'NotFoundException' && err.name !== 'ChecksumException' && err.name !== 'FormatException') {
            console.warn("Scan frame error:", err);
          }
        });
      };

      useEffect(() => {
        let active = true;

        if (isScanning) {
          setCameraError(null);
          setCameraStatus("Starting camera...");

          const initCamera = async () => {
            try {
              if (typeof ZXing === 'undefined') {
                throw new Error("Scanner library is still loading.");
              }

              const hints = new Map();
              if (ZXing.BarcodeFormat && ZXing.DecodeHintType) {
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                  ZXing.BarcodeFormat.EAN_13,
                  ZXing.BarcodeFormat.EAN_8,
                  ZXing.BarcodeFormat.UPC_A,
                  ZXing.BarcodeFormat.UPC_E,
                  ZXing.BarcodeFormat.CODE_128,
                  ZXing.BarcodeFormat.CODE_39,
                  ZXing.BarcodeFormat.ITF,
                  ZXing.BarcodeFormat.QR_CODE
                ]);
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
              }

              const codeReader = new ZXing.BrowserMultiFormatReader(hints);
              codeReaderRef.current = codeReader;

              if (!videoRef.current) return;

              let videoDevices = [];
              try {
                videoDevices = await codeReader.listVideoInputDevices();
              } catch (e) {
                console.warn("Device list is currently hidden.", e);
              }

              if (!active) return;

              let chosenId = undefined;

              if (videoDevices && videoDevices.length > 0) {
                setAvailableCameras(videoDevices);
                const backCam = videoDevices.find(d => /back|rear|environment/i.test(d.label));
                chosenId = backCam ? backCam.deviceId : videoDevices[0].deviceId;
                setActiveCameraId(chosenId);
              } else {
                setAvailableCameras([]);
                setActiveCameraId(null);
              }

              setCameraStatus("");
              await startDecoding(chosenId);

            } catch (err) {
              console.error("Camera access error:", err);
              if (active) {
                if (err.name === 'NotAllowedError' || err.message?.includes('denied')) {
                  setCameraError("Camera permission denied.");
                } else {
                  setCameraError(err.message || "Could not start camera.");
                }
                setCameraStatus("");
              }
            }
          };

          initCamera();
        }

        return () => {
          active = false;
          if (codeReaderRef.current) {
            codeReaderRef.current.reset();
            codeReaderRef.current = null;
          }
          releaseCameraStream();
        };
      }, [isScanning]);

      const stopCameraScan = () => {
        if (codeReaderRef.current) {
          codeReaderRef.current.reset();
          codeReaderRef.current = null;
        }
        releaseCameraStream();
        setIsScanning(false);
        setCameraError(null);
        setCameraStatus("");
      };

      const switchCamera = async () => {
        if (availableCameras.length < 2) return;
        const currentIndex = availableCameras.findIndex(d => d.deviceId === activeCameraId);
        const nextDevice = availableCameras[(currentIndex + 1) % availableCameras.length];

        if (codeReaderRef.current) {
          codeReaderRef.current.reset();
        }
        releaseCameraStream();

        setActiveCameraId(nextDevice.deviceId);
        try {
          await startDecoding(nextDevice.deviceId);
        } catch (err) {
          console.error("Camera switch error:", err);
          setCameraError("Could not switch camera.");
        }
      };

      const selectedItem = useMemo(() => {
        if (!items.length) return null;
        if (!searchQuery.trim()) return items[0];

        const query = searchQuery.trim().toLowerCase();

        const exactCode = items.find(i => String(i.code || "").toLowerCase() === query);
        if (exactCode) return exactCode;

        return items.find(i => 
          String(i.code || "").toLowerCase().includes(query) ||
          String(i.name || "").toLowerCase().includes(query)
        ) || null;
      }, [items, searchQuery]);

      const fetchSheetData = async (url) => {
        setIsSyncing(true);
        setSyncError(null);

        try {
          let csvUrl = url;
          const sheetIdMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
          if (sheetIdMatch && sheetIdMatch[1]) {
            const spreadsheetId = sheetIdMatch[1];
            let gid = "828283876";
            const gidMatch = url.match(/gid=([0-9]+)/);
            if (gidMatch && gidMatch[1]) {
              gid = gidMatch[1];
            }
            csvUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&gid=${gid}`;
          }

          const response = await fetch(csvUrl);
          if (!response.ok) throw new Error("Could not access spreadsheet.");
          
          const csvText = await response.text();
          const parsedData = parseCSVToItems(csvText);

          if (parsedData.length === 0) {
            throw new Error("No products found in sheet.");
          }

          setItems(parsedData);
        } catch (err) {
          console.error(err);
          setSyncError(err.message || "Failed to load sheet.");
        } finally {
          setIsSyncing(false);
        }
      };

      const parseCSVToItems = (text) => {
        const lines = [];
        let row = [""];
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const nextChar = text[i+1];

          if (char === '"') {
            if (inQuotes && nextChar === '"') {
              row[row.length - 1] += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            row.push('');
          } else if ((char === '\r' || char === '\n') && !inQuotes) {
            if (char === '\r' && nextChar === '\n') {
              i++;
            }
            lines.push(row);
            row = [''];
          } else {
            row[row.length - 1] += char;
          }
        }
        if (row.length > 1 || row[0] !== '') {
          lines.push(row);
        }

        if (lines.length < 2) return [];

        const headers = lines[0].map(h => h.trim().toLowerCase());
        
        const brandIdx = headers.findIndex(h => h.includes('brand')) !== -1 ? headers.findIndex(h => h.includes('brand')) : 0;
        const classIdx = headers.findIndex(h => h.includes('class')) !== -1 ? headers.findIndex(h => h.includes('class')) : 1;
        const codeIdx = headers.findIndex(h => h.includes('code')) !== -1 ? headers.findIndex(h => h.includes('code')) : 2;
        const nameIdx = headers.findIndex(h => h.includes('name') || h.includes('item')) !== -1 ? headers.findIndex(h => h.includes('name') || h.includes('item')) : 3;
        const imageIdx = 4;
        const descIdx = headers.findIndex(h => h.includes('desc') || h.includes('detail') || h.includes('description')) !== -1 ? headers.findIndex(h => h.includes('desc') || h.includes('detail') || h.includes('description')) : 5;
        
        // Changed qtyIdx to Column M (0-indexed position 12)
        const qtyIdx = 12; 

        const promoIdx = headers.findIndex(h => h.includes('promo') || h.includes('promotion') || h.includes('offer')) !== -1 ? headers.findIndex(h => h.includes('promo') || h.includes('promotion') || h.includes('offer')) : 7;
        const priceIdx = 9;

        const itemsParsed = [];
        for (let r = 1; r < lines.length; r++) {
          const line = lines[r];
          if (line.length <= 1 || !line[nameIdx]) continue;

          let rawImgUrl = line[imageIdx] ? line[imageIdx].replace(/^["']|["']$/g, '').trim() : "";

          if (rawImgUrl && rawImgUrl.includes('drive.google.com')) {
            const fileIdMatch = rawImgUrl.match(/id=([a-zA-Z0-9-_]+)/) || rawImgUrl.match(/\/file\/d\/([a-zA-Z0-9-_]+)/);
            if (fileIdMatch && fileIdMatch[1]) {
              rawImgUrl = `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`;
            }
          }

          let rawPriceStr = (line.length > priceIdx && line[priceIdx]) ? line[priceIdx] : "0";
          const cleanPrice = parseFloat(rawPriceStr.replace(/[^\d.-]/g, '')) || 0;

          const item = {
            brand: line[brandIdx] ? line[brandIdx].trim() : "General",
            itemClass: line[classIdx] ? line[classIdx].trim() : "Products",
            code: line[codeIdx] ? line[codeIdx].trim() : `ITEM-${r}`,
            name: line[nameIdx] ? line[nameIdx].trim() : `Product ${r}`,
            description: line[descIdx] ? line[descIdx].trim() : "No description provided.",
            qty: (line.length > qtyIdx && line[qtyIdx]) ? line[qtyIdx].trim() : "N/A",
            promotion: (line.length > promoIdx && line[promoIdx]) ? line[promoIdx].trim() : null,
            price: cleanPrice,
            imageUrl: rawImgUrl
          };

          itemsParsed.push(item);
        }

        return itemsParsed;
      };

      const handleExportImage = async () => {
        if (!selectedItem) return;
        setExporting(true);

        try {
          if (typeof html2canvas === 'undefined') {
            throw new Error("Loading renderer...");
          }

          const canvas = await html2canvas(cardRef.current, {
            useCORS: true, 
            allowTaint: true,
            backgroundColor: "#ffffff",
            scale: 2
          });

          const image = canvas.toDataURL("image/png");
          const link = document.createElement("a");
          link.download = `${selectedItem.code}_${selectedItem.name.replace(/\s+/g, '_')}_combo.png`;
          link.href = image;
          link.click();
        } catch (err) {
          console.error(err);
          alert("Notice: Export complete.");
        } finally {
          setExporting(false);
        }
      };

      return (
        <div className={`w-full h-full flex flex-col justify-between overflow-hidden select-none ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-[#fbf9f4] text-slate-800'}`}>
          
          {/* HEADER WITH LOGO */}
          <header className={`px-5 py-3.5 border-b shrink-0 flex items-center justify-between ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-[#fcfbfa] border-[#e8e2d5]'}`}>
            <div className="flex items-center space-x-3.5 truncate">
              <img 
                src={logoUrl} 
                alt="L'Imperial Catalog Logo" 
                className="h-10 object-contain shrink-0" 
                crossOrigin="anonymous"
                onError={(e) => {
                  e.target.style.display = 'none';
                }}
              />
              <div className="truncate">
                <h1 className={`text-lg font-serif-elegant font-bold leading-tight truncate ${isDarkMode ? 'text-white' : 'text-[#3e3428]'}`}>Scanner V4</h1>
              </div>
            </div>
            
            <button
              onClick={() => setIsDarkMode(!isDarkMode)}
              className={`p-2.5 rounded-xl border transition-all ${
                isDarkMode 
                  ? 'bg-slate-800 border-slate-700 text-amber-400' 
                  : 'bg-[#f5f1e8] border-[#e8e2d5] text-[#8c734b]'
              }`}
            >
              {isDarkMode ? <SvgIcons.Sun /> : <SvgIcons.Moon />}
            </button>
          </header>

          {/* EXPANDED BIGGER SEARCH BAR */}
          <div className="px-5 pt-4 pb-2 shrink-0 w-full max-w-3xl mx-auto">
            {syncError && (
              <div className="mb-2 p-2 bg-rose-50 text-rose-700 rounded-lg text-xs flex items-center gap-1 border border-rose-100">
                <SvgIcons.Alert />
                <span className="truncate">{syncError}</span>
              </div>
            )}

            <div className="relative flex items-center">
              <div className="absolute left-4 text-[#b09d82]">
                <SvgIcons.Search />
              </div>
              <input
                type="text"
                placeholder="Scan barcode or search code/name..."
                className={`w-full pl-12 pr-32 py-3.5 border-2 rounded-2xl text-sm font-medium focus:outline-none focus:ring-4 focus:ring-[#c49a45]/20 focus:border-[#c49a45] transition-all shadow-sm ${
                  isDarkMode ? 'bg-slate-900 border-slate-800 text-white placeholder-slate-500' : 'bg-white border-[#e8e2d5] text-slate-800 placeholder-[#b09d82]'
                }`}
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
              
              <div className="absolute right-2 flex items-center gap-2">
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery("")}
                    className="px-2 py-1 text-xs text-slate-400 hover:text-slate-600"
                  >
                    Clear
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => setIsScanning(true)}
                  className="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#c49a45] hover:bg-[#b08738] text-white font-bold text-xs shadow-md active:scale-95 transition-all"
                >
                  <SvgIcons.Barcode />
                  <span>Scan</span>
                </button>
              </div>
            </div>
          </div>

          {/* CAMERA SCANNER MODAL */}
          {isScanning && (
            <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-4">
              <div className="relative bg-slate-900 p-5 rounded-2xl max-w-md w-full flex flex-col items-center space-y-4 border border-slate-800 shadow-2xl">
                <div className="flex items-center justify-between w-full">
                  <h3 className="text-white text-sm font-bold flex items-center gap-2">
                    <SvgIcons.Barcode />
                    <span>Scan Barcode</span>
                  </h3>
                  {availableCameras.length > 1 && !cameraError && (
                    <button
                      onClick={switchCamera}
                      className="p-2 rounded-lg bg-slate-800 text-slate-200"
                    >
                      <SvgIcons.Camera />
                    </button>
                  )}
                </div>
                
                <div className="w-full h-56 rounded-xl overflow-hidden border-2 border-[#c49a45]/50 relative bg-black flex items-center justify-center">
                  <video 
                    ref={videoRef} 
                    autoPlay 
                    playsInline 
                    muted 
                    className="w-full h-full object-cover"
                  ></video>
                  {!cameraError && (
                    <div className="absolute inset-0 border-2 border-[#c49a45] animate-pulse pointer-events-none rounded-xl"></div>
                  )}
                  {cameraStatus && !cameraError && (
                    <div className="absolute inset-0 flex items-center justify-center bg-black/60 text-slate-200 text-xs font-medium px-4 text-center">
                      {cameraStatus}
                    </div>
                  )}
                  {cameraError && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center gap-1 bg-black/80 text-rose-300 text-xs font-medium px-4 text-center">
                      <SvgIcons.Alert />
                      <span>{cameraError}</span>
                    </div>
                  )}
                </div>
                
                <button
                  onClick={stopCameraScan}
                  className="w-full py-2.5 bg-rose-600 text-white rounded-xl text-xs font-bold"
                >
                  Cancel
                </button>
              </div>
            </div>
          )}

          {/* EXPANDED BIGGER CATALOG SECTION */}
          <div className="flex-1 p-4 min-h-0 flex items-center justify-center overflow-hidden w-full max-w-4xl mx-auto">
            {selectedItem ? (
              <div 
                ref={cardRef} 
                className={`flex flex-col rounded-2xl overflow-hidden shadow-md border w-full h-full transition-all duration-300 ${
                  isDarkMode ? 'border-slate-800 bg-slate-900 text-white' : 'border-[#e8e2d5] bg-white text-slate-800'
                }`}
              >
                {/* Product Image Stage */}
                <div className={`w-full flex-1 relative flex items-center justify-center overflow-hidden border-b p-4 min-h-0 ${
                  isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-[#faf8f5] border-[#e8e2d5]'
                }`}>
                  {selectedItem.imageUrl ? (
                    <img 
                      src={selectedItem.imageUrl} 
                      alt={selectedItem.name} 
                      className="w-full h-full object-contain block"
                      crossOrigin="anonymous"
                      onError={(e) => {
                        e.target.onerror = null;
                        e.target.src = "https://images.unsplash.com/photo-1594322436404-5a0526db4d13?auto=format&fit=crop&w=600&q=80";
                      }}
                    />
                  ) : (
                    <div className="flex flex-col items-center justify-center text-slate-400 p-4">
                      <SvgIcons.Image />
                      <span className="text-xs font-medium mt-2">No Image Available</span>
                    </div>
                  )}
                  
                  <div className="absolute top-3 left-3 bg-black/75 backdrop-blur-md text-[10px] text-white px-2.5 py-1 rounded-md font-mono-code uppercase tracking-wider">
                    {selectedItem.brand} / {selectedItem.itemClass}
                  </div>
                </div>

                {/* Product Details Section */}
                <div className="w-full p-5 flex flex-col justify-between items-center text-center shrink-0">
                  <div className="w-full">
                    <span className="inline-block bg-[#f5efe3] text-[#8c6d32] text-xs font-semibold px-3.5 py-1 rounded-full uppercase tracking-widest mb-2">
                      Code: {selectedItem.code}
                    </span>
                    <h2 className="text-2xl font-serif-elegant font-bold tracking-normal italic line-clamp-1">
                      {selectedItem.name}
                    </h2>
                    <p className="text-xs mt-1.5 leading-relaxed opacity-80 line-clamp-2 max-w-xl mx-auto">
                      {selectedItem.description}
                    </p>
                  </div>

                  {/* Luxury Gold Price Tag */}
                  <div className={`text-2xl font-serif-elegant font-bold text-[#c49a45] border-t border-b py-2 px-8 mt-3 w-full max-w-[260px] ${
                    isDarkMode ? 'border-slate-800' : 'border-[#e8e2d5]'
                  }`}>
                    ${selectedItem.price ? selectedItem.price.toLocaleString(undefined, {minimumFractionDigits: 2}) : "0.00"}
                  </div>

                  {/* Quantity and Promotion Section */}
                  <div className="mt-3 flex flex-wrap items-center justify-center gap-2 text-xs font-medium">
                    <span className={`px-3 py-1 rounded-lg border ${
                      isDarkMode ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-[#f5f1e8] border-[#e8e2d5] text-[#6e5d44]'
                    }`}>
                      Qty: <strong className="font-bold">{selectedItem.qty}</strong>
                    </span>
                    {selectedItem.promotion && (
                      <span className="px-3 py-1 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 font-semibold">
                        Promo: {selectedItem.promotion}
                      </span>
                    )}
                  </div>
                </div>
              </div>
            ) : (
              <div className={`rounded-2xl border-2 border-dashed p-12 text-center text-slate-400 w-full h-full flex flex-col justify-center items-center ${
                isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-[#f7f4ee] border-[#e8e2d5]'
              }`}>
                <div className="mb-3 text-slate-300"><SvgIcons.Image /></div>
                <p className="font-bold text-sm text-slate-600 dark:text-slate-300">No Product Found</p>
                <p className="text-xs text-slate-400 mt-1">Scan barcode or adjust your search.</p>
              </div>
            )}
          </div>

          {/* BOTTOM EXPORT BUTTON */}
          <div className="px-5 pt-1 pb-3 shrink-0 w-full max-w-3xl mx-auto">
            <button
              onClick={handleExportImage}
              disabled={exporting || !selectedItem}
              className="w-full py-3.5 px-6 bg-gradient-to-r from-[#c49a45] to-[#b08738] hover:from-[#b08738] hover:to-[#9e762c] disabled:opacity-50 text-white font-bold text-sm rounded-2xl transition-all shadow-md flex items-center justify-center space-x-2 active:scale-95"
            >
              <SvgIcons.Download />
              <span>{exporting ? "Rendering..." : "Export Card Image"}</span>
            </button>
          </div>

          {/* FOOTER */}
          <footer className={`border-t py-2 text-center text-[10px] shrink-0 ${
            isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-500' : 'bg-[#fcfbfa] border-[#e8e2d5] text-[#a19482]'
          }`}>
            <p>&copy; 2026 Scanner V4</p>
          </footer>

        </div>
      );
    }

    const container = document.getElementById('app-root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>

  <!-- Progressive Web App (PWA) Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
